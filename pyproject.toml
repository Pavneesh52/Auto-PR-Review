[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Production-grade AI PR review agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "cryptography>=44.0.0",
    # Phase 4: Data layer
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # Phase 5: Orchestrator
    "langgraph>=0.2.60",
    # Phases 6-9: LLM-powered agents
    "openai>=1.50.0",
    # Phase 20: Deployment. Required at runtime, not just for development:
    # the container entrypoint runs `alembic upgrade head` before serving.
    "alembic>=1.14.0",
]

[project.scripts]
pr-review-agent = "pr_review_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
